interface:
  display_name: "Source-Driven Multilingual Listing"
  short_description: "依据卖点、中文参考和模特图制作并审核多语言商品图"
  default_prompt: "Use $source-view-listing-images to produce and review a source-bound Listing set for the specified market."
compatibility:
  canonical_format: "agent-skills"
  adapter_targets: ["openai"]
  activation:
    mode: "manual"
    paths: []
  execution:
    context: "inline"
    shell: "bash"
  trust:
    source_tier: "local"
    remote_inline_execution: "forbid"
    remote_metadata_policy: "allow-metadata-only"
  degradation:
    openai: "metadata-adapter"
